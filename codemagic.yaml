workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.minharotarp.app
        certificate: Minha Rota RP Distribution
        provisioning_profile: minha_rota_rp_appstore
      vars:
        APP_ID: com.minharotarp.app
        BUNDLE_ID: com.minharotarp.app
        APP_VERSION: "1.0.0"
        BUILD_NUMBER: "1"
        TEAM_ID: UH2FLNQHY8
      node: 18
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI
        script: |
          npm install -g @capacitor/cli

      - name: Create Capacitor config
        script: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.minharotarp.app",
            "appName": "Minha Rota RP",
            "webDir": ".",
            "server": {
              "androidScheme": "https"
            },
            "ios": {
              "contentInset": "automatic"
            }
          }
          EOF

      - name: Add iOS platform
        script: |
          npx cap add ios || true

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $BUILD_NUMBER

      - name: Update signing settings
        script: |
          cd ios/App
          xcode-project use-profiles \
            --project App.xcodeproj \
            --scheme App \
            --export-options-plist ~/export_options.plist

      - name: Build iOS archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="minha_rota_rp_appstore"

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build \
            -exportOptionsPlist ~/export_options.plist

    artifacts:
      - build/**/*.ipa
      - build/**/*.xcarchive
      - ios/App/build/**/*.ipa
      - ios/App/build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        issuer_id: a7cfc2a3-4714-4f05-925e-29aa492ef87b
        key_id: MN29GVLB23
        submit_to_testflight: true
        submit_to_app_store: false
