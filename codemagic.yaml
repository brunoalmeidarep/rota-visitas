workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.minharotarp.app
      vars:
        APP_ID: com.minharotarp.app
        BUNDLE_ID: com.minharotarp.app
        APP_VERSION: "1.0.0"
        BUILD_NUMBER: "66"
        TEAM_ID: UH2FLNQHY8
      node: 18
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Copy web assets to www
        script: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=$TEAM_ID

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build \
            -exportOptionsPlist ~/export_options.plist

    artifacts:
      - build/**/*.ipa
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
